name: V4 Benchmark

on:
  push:
    branches: [v4-vibecoder-html-js-css]
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Internal 500 gate
        run: npm test
      - name: External Gemini 500 first-shot
        run: node test_external_firstshot.mjs
