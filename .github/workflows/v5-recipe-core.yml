name: V5 Recipe Core

on:
  push:
    branches: [v5-recipe-combinatorial-core]
  pull_request:

jobs:
  recipe-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: V4 regression
        run: npm test
      - name: V5 recipe combinatorial core
        run: npm run test:recipe-v0
